<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Seleccionar negocio</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #0a0a0a;
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: #fff;
        }

        h1 {
            font-size: 1.4rem;
            font-weight: 300;
            letter-spacing: 0.08em;
            color: #aaa;
            margin-bottom: 2.5rem;
            text-align: center;
            text-transform: uppercase;
        }

        .tarjetas {
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
            justify-content: center;
            padding: 1rem;
        }

        .tarjeta {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 280px;
            height: 320px;
            border-radius: 20px;
            text-decoration: none;
            color: #fff;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            padding: 2rem;
            text-align: center;
        }

        .tarjeta:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }

        .tarjeta.tecnikor {
            background: linear-gradient(145deg, #0E2A47 0%, #1a4a7a 100%);
            border: 1px solid #1e5288;
        }

        .tarjeta.betty {
            background: linear-gradient(145deg, #5a0a45 0%, #8B1A6B 50%, #C2185B 100%);
            border: 1px solid #c2185b;
        }

        .icono {
            font-size: 4rem;
            margin-bottom: 1.2rem;
            filter: drop-shadow(0 2px 8px rgba(0,0,0,0.4));
        }

        .tarjeta h2 {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }

        .tarjeta p {
            font-size: 0.95rem;
            font-weight: 300;
            opacity: 0.85;
            letter-spacing: 0.04em;
        }

        footer {
            margin-top: 3rem;
            color: #444;
            font-size: 0.75rem;
        }

        @media (max-width: 640px) {
            .tarjeta { width: 100%; max-width: 340px; height: 260px; }
            h1 { font-size: 1.1rem; }
        }
    </style>
</head>
<body>
    <h1>&#x1F4BC; &nbsp; ¿Con qué negocio vas a trabajar hoy?</h1>

    <div class="tarjetas">
        <a href="/ventas/nueva" class="tarjeta tecnikor">
            <div class="icono">&#x1F527;</div>
            <h2>TECNIKOR</h2>
            <p>Repuestos &amp; Electrodomésticos</p>
        </a>
        <a href="/betty/pos" class="tarjeta betty">
            <div class="icono">&#x1F338;</div>
            <h2>BETTY</h2>
            <p>Belleza y Cuidado</p>
        </a>
    </div>

    <footer>Sistema de Inventario · Tecnikor &amp; Betty</footer>
</body>
</html>
