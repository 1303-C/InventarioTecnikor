<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{betty/layout-betty :: main(~{::title}, ~{::section})}">
<head>
    <title th:text="'Venta #' + ${venta.numero} + ' · Betty'">Detalle Venta · Betty</title>
</head>
<body>
<section>
    <div class="fila-titulo" style="margin-bottom:1rem">
        <h1 style="color:#8B1A6B">
            Venta #<span th:text="${venta.numero}">0</span>
            <span th:if="${'ANULADA'.equals(venta.estado)}"
                  style="font-size:.9rem;color:#e53935;margin-left:.5rem">(ANULADA)</span>
        </h1>
        <a class="boton-secundario" th:href="@{/betty/ventas}">&#x2190; Volver al historial</a>
    </div>

    <!-- Info general -->
    <div style="background:#fdf7fc;border:1px solid #e0c8e8;border-radius:12px;padding:1.2rem;margin-bottom:1.5rem;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:.8rem">
        <div>
            <div style="font-size:.75rem;color:#999;text-transform:uppercase">Fecha</div>
            <div style="font-weight:600" th:text="${#temporals.format(venta.fecha, 'dd/MM/yyyy HH:mm')}">--</div>
        </div>
        <div>
            <div style="font-size:.75rem;color:#999;text-transform:uppercase">Forma de pago</div>
            <div style="font-weight:600" th:text="${venta.formaPago}">EFECTIVO</div>
        </div>
        <div>
            <div style="font-size:.75rem;color:#999;text-transform:uppercase">Estado</div>
            <div style="font-weight:700"
                 th:text="${venta.estado}"
                 th:style="${'ANULADA'.equals(venta.estado)} ? 'color:#e53935' : 'color:#2e7d32'">COMPLETADA</div>
        </div>
        <div>
            <div style="font-size:.75rem;color:#999;text-transform:uppercase">Total</div>
            <div style="font-weight:800;font-size:1.3rem;color:#C2185B"
                 th:text="'$ ' + ${#numbers.formatDecimal(venta.total, 1, 'POINT', 0, 'COMMA')}">$ 0</div>
        </div>
    </div>

    <!-- Motivo de anulacion -->
    <div th:if="${'ANULADA'.equals(venta.estado)}"
         style="background:#fff5f5;border:1px solid #e53935;border-radius:8px;padding:1rem;margin-bottom:1.5rem;color:#b71c1c">
        <strong>Motivo de anulación:</strong> <span th:text="${venta.motivoAnulacion}">--</span><br>
        <span style="font-size:.8rem;color:#999"
              th:if="${venta.fechaAnulacion != null}"
              th:text="'Anulada el ' + ${#temporals.format(venta.fechaAnulacion, 'dd/MM/yyyy HH:mm')}"></span>
    </div>

    <!-- Lineas -->
    <table style="width:100%;border-collapse:collapse;margin-bottom:1.5rem">
        <thead>
        <tr style="background:#f8f0f5;border-bottom:2px solid #C2185B">
            <th style="padding:.6rem;text-align:left">Descripción</th>
            <th style="padding:.6rem;text-align:right">Precio Unit.</th>
            <th style="padding:.6rem;text-align:right">Cantidad</th>
            <th style="padding:.6rem;text-align:right">Subtotal</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="l : ${venta.lineas}" style="border-bottom:1px solid #f0e0f0">
            <td style="padding:.5rem" th:text="${l.descripcion}">Item</td>
            <td style="padding:.5rem;text-align:right"
                th:text="${#numbers.formatDecimal(l.precioUnit, 1, 'POINT', 0, 'COMMA')}">0</td>
            <td style="padding:.5rem;text-align:right" th:text="${l.cantidad}">1</td>
            <td style="padding:.5rem;text-align:right;font-weight:700"
                th:text="${#numbers.formatDecimal(l.subtotal, 1, 'POINT', 0, 'COMMA')}">0</td>
        </tr>
        </tbody>
        <tfoot>
        <tr style="border-top:2px solid #C2185B">
            <td colspan="3" style="padding:.6rem;text-align:right;font-weight:700">TOTAL</td>
            <td style="padding:.6rem;text-align:right;font-weight:800;font-size:1.1rem;color:#C2185B"
                th:text="'$ ' + ${#numbers.formatDecimal(venta.total, 1, 'POINT', 0, 'COMMA')}">$ 0</td>
        </tr>
        </tfoot>
    </table>

    <!-- Boton anular -->
    <div th:if="${'COMPLETADA'.equals(venta.estado)}">
        <details style="background:#fff5f5;border:1px solid #ffcdd2;border-radius:10px;padding:1rem">
            <summary style="font-weight:600;color:#c62828;cursor:pointer">&#x26A0; Anular esta venta</summary>
            <form method="post" th:action="@{/betty/ventas/{id}/anular(id=${venta.id})}"
                  style="margin-top:1rem;display:flex;gap:.8rem;flex-wrap:wrap;align-items:flex-end"
                  onsubmit="return confirm('¿Seguro que deseas anular la venta #' + document.querySelector('[name=numero]').value + '?')">
                <input type="hidden" name="numero" th:value="${venta.numero}">
                <div class="campo" style="flex:1;min-width:200px">
                    <label for="motivo">Motivo de anulación <span style="color:red">*</span></label>
                    <input type="text" id="motivo" name="motivo" required placeholder="Ej. Error en el precio...">
                </div>
                <button type="submit" class="boton boton-peligro">Anular venta</button>
            </form>
        </details>
    </div>
</section>
</body>
</html>
