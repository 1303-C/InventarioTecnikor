<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{betty/layout-betty :: main(~{::title}, ~{::section})}">
<head>
    <title>Precios Perfume · Betty Admin</title>
</head>
<body>
<section>
    <div class="fila-titulo" style="margin-bottom:1.5rem">
        <h1 style="color:#8B1A6B">Precios de Perfume (ml × oz)</h1>
    </div>

    <!-- Formulario agregar combinación -->
    <div style="background:#fdf7fc;border:1px solid #e0c8e8;border-radius:14px;padding:1.5rem;margin-bottom:2rem">
        <h3 style="color:#8B1A6B;margin-bottom:1rem">Agregar o actualizar combinación</h3>
        <form method="post" th:action="@{/betty/admin/precios-perfume}"
              style="display:flex;gap:1rem;flex-wrap:wrap;align-items:flex-end">
            <div class="campo">
                <label for="ml">Mililitros (ml) <span style="color:red">*</span></label>
                <input type="number" id="ml" name="ml" min="1" required placeholder="Ej. 30, 60, 100">
            </div>
            <div class="campo">
                <label for="onzas">Onzas <span style="color:red">*</span></label>
                <input type="number" id="onzas" name="onzas" min="0" step="0.25" required placeholder="Ej. 1.0, 2.5">
            </div>
            <div class="campo">
                <label for="precio">Precio <span style="color:red">*</span></label>
                <input type="number" id="precio" name="precio" min="0" step="1" required>
            </div>
            <button type="submit" class="boton">Guardar</button>
        </form>
        <p style="font-size:.8rem;color:#999;margin-top:.5rem">
            Si ya existe la combinación ml/oz, actualiza el precio.
        </p>
    </div>

    <!-- Tabla -->
    <div th:if="${precios.isEmpty()}" style="color:#aaa">
        No hay combinaciones de precios configuradas.
    </div>

    <table th:unless="${precios.isEmpty()}" style="width:100%;border-collapse:collapse">
        <thead>
        <tr style="background:#f8f0f5;border-bottom:2px solid #C2185B">
            <th style="padding:.6rem;text-align:right">ml</th>
            <th style="padding:.6rem;text-align:right">Onzas</th>
            <th style="padding:.6rem;text-align:right">Precio</th>
            <th style="padding:.6rem"></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="p : ${precios}" style="border-bottom:1px solid #f0e0f0">
            <td style="padding:.5rem;text-align:right;font-weight:600" th:text="${p.ml} + ' ml'">ml</td>
            <td style="padding:.5rem;text-align:right" th:text="${p.onzas} + ' oz'">oz</td>
            <td style="padding:.5rem;text-align:right;font-weight:700;color:#C2185B"
                th:text="'$ ' + ${#numbers.formatDecimal(p.precio, 1, 'POINT', 0, 'COMMA')}">$ 0</td>
            <td style="padding:.5rem">
                <form method="post" th:action="@{/betty/admin/precios-perfume/eliminar/{id}(id=${p.id})}"
                      onsubmit="return confirm('¿Eliminar este precio?')">
                    <button type="submit" class="boton-mini boton-peligro">Eliminar</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</section>
</body>
</html>
