<!DOCTYPE html>
<!--
  Pagina de impresion de etiquetas. NO usa el layout (nada de menu ni pie):
  es solo las etiquetas. Al cargar lanza el dialogo de impresion.

  El tamano de cada etiqueta y de la "pagina" (@page) se arma con los mm que
  llegan por parametro, usando th:inline="css".
-->
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Etiquetas para imprimir</title>
    <style th:inline="css">
        @page {
            size: [[${ancho}]]mm [[${alto}]]mm;
            margin: 0;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #e9ecef;
        }
        .barra {
            padding: 10px 16px;
            background: #0E2A47;
            color: #fff;
            font-size: 0.9rem;
        }
        .barra button {
            margin-left: 12px;
            padding: 4px 12px;
            border: 0;
            border-radius: 4px;
            background: #1677BB;
            color: #fff;
            cursor: pointer;
        }
        .hoja {
            padding: 16px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .etiqueta {
            width: [[${ancho}]]mm;
            height: [[${alto}]]mm;
            background: #fff;
            border: 1px solid #bbb;
            padding: 2mm;
            display: flex;
            align-items: center;
            gap: 2mm;
            overflow: hidden;
        }
        .etiqueta img {
            height: calc([[${alto}]]mm - 4mm);
            width: auto;
        }
        .etiqueta-datos {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 1mm;
        }
        .etiqueta-nombre {
            font-size: 2.4mm;
            font-weight: 700;
            line-height: 1.1;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .etiqueta-codigo {
            font-family: "Consolas", monospace;
            font-size: 2.1mm;
        }
        .etiqueta-precio { font-size: 2.6mm; font-weight: 700; }

        @media print {
            body { background: #fff; }
            .barra { display: none; }
            .hoja { padding: 0; gap: 0; }
            .etiqueta {
                border: 0;
                page-break-after: always;
                break-after: page;
            }
        }
    </style>
</head>
<body onload="window.print()">

<div class="barra">
    <span th:text="'Etiquetas: ' + ${#lists.size(productos)} + ' producto(s) x ' + ${copias} + ' copia(s) — ' + ${ancho} + 'x' + ${alto} + ' mm'">
        Etiquetas
    </span>
    <button type="button" onclick="window.print()">Imprimir de nuevo</button>
</div>

<div class="hoja">
    <th:block th:each="p : ${productos}">
        <div class="etiqueta" th:each="c : ${#numbers.sequence(1, copias)}">
            <img th:src="@{/productos/{id}/qr.png(id=${p.id})}" alt="QR">
            <div class="etiqueta-datos">
                <span class="etiqueta-nombre" th:text="${p.nombre}">Nombre del producto</span>
                <span class="etiqueta-codigo" th:text="${p.codigoQr}">COD-QR</span>
                <span class="etiqueta-precio"
                      th:if="${p.precioVenta != null}"
                      th:text="'$ ' + ${#numbers.formatDecimal(p.precioVenta, 1, 'POINT', 0, 'COMMA')}">$ 0</span>
            </div>
        </div>
    </th:block>
</div>

</body>
</html>
