spring.application.name=InventarioTecnikor

# ==========================================================
#  Base de datos: SQLite (archivo inventario.db en la raiz)
# ==========================================================
# En .NET seria la "connection string". "jdbc:sqlite:" + ruta relativa
# = se crea/abre el archivo en el directorio donde arrancas la app.
spring.datasource.url=jdbc:sqlite:inventario.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# SQLite permite UN solo escritor a la vez sobre el archivo. Si dejamos el
# pool de conexiones por defecto (10), es facil toparse con "SQLITE_BUSY:
# database is locked". Con 1 conexion las escrituras se serializan y punto.
# Para un inventario de un taller es mas que suficiente.
spring.datasource.hikari.maximum-pool-size=1

# ==========================================================
#  JPA / Hibernate
# ==========================================================
# "update": al arrancar, Hibernate compara tus @Entity con las tablas y
# crea las que falten / agrega columnas nuevas. NO borra ni modifica
# columnas existentes. Comodo para aprender; en produccion se suele pasar
# a "validate" + migraciones (Flyway/Liquibase).
spring.jpa.hibernate.ddl-auto=update

# Hibernate necesita que le digamos explicitamente el dialecto de SQLite
# porque vive en el jar "hibernate-community-dialects" y no se autodetecta.
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect

# Ver el SQL que genera Hibernate en consola (util mientras aprendes).
# Ponlo en false cuando te canse el ruido.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Mantiene abierta la sesion de JPA hasta que termina de renderizar la
# vista Thymeleaf. Evita LazyInitializationException al pintar relaciones
# @ManyToOne en las plantillas. Comodo para este proyecto; en APIs grandes
# se considera un anti-patron y se desactiva.
spring.jpa.open-in-view=true

# ==========================================================
#  Negocio: encabezado del ticket de venta
# ==========================================================
tecnikor.negocio.nombre=Tecnikor
tecnikor.negocio.nit=
tecnikor.negocio.direccion=Calle 13 #20-64, Centro, Cumaral, Meta
tecnikor.negocio.telefono=3117049613

# ==========================================================
#  Impresora de tickets (POS 80mm, ESC/POS)
# ==========================================================
# transporte: none -> no imprime, solo lo anota en el log (desarrollo)
#             tcp  -> por red, a host:puerto (9100 es el habitual)
#             raw  -> impresora instalada en Windows, por su nombre exacto
tecnikor.ticket.transporte=none
tecnikor.ticket.host=
tecnikor.ticket.puerto=9100
tecnikor.ticket.timeout-ms=4000
tecnikor.ticket.nombre-impresora=
tecnikor.ticket.cortar=true
tecnikor.ticket.abrir-cajon-en-efectivo=true
tecnikor.ticket.ancho-caracteres=42
